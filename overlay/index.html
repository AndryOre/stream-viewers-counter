<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stream Viewers Counter</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      #root {
        position: fixed;
        top: 16px;
        left: 16px;
      }
      .pill {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 14px;
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-family: sans-serif;
        font-size: 20px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      .platform,
      .total {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .platform.stale {
        opacity: 0.4;
        filter: grayscale(1);
      }
      .icon {
        width: 22px;
        height: 22px;
      }
      .total {
        font-weight: 700;
        font-size: 26px;
        gap: 10px;
      }
      .total-label {
        font-size: 14px;
        text-transform: uppercase;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
