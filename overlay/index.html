<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stream Viewers Counter</title>
    <style>
      /*__INTER_FONT_FACE__*/
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      #root {
        position: fixed;
        top: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        transform-origin: left top;
      }
      .pill {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 16px;
        border-radius: var(--pill-radius, 16px);
        background: var(--pill-bg, rgba(0, 0, 0, 0.55));
        color: var(--text-color, #fff);
        font-family: var(--font-family, "Inter", system-ui, sans-serif);
        font-size: 20px;
        font-weight: 400;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        font-variant-numeric: tabular-nums;
        opacity: 0;
        transition: opacity 300ms ease;
      }
      .pill.shown {
        opacity: 1;
      }
      .platform,
      .total {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .platform {
        opacity: 0;
        transition:
          opacity 300ms ease,
          filter 300ms ease;
      }
      .platform.visible {
        opacity: 1;
      }
      .platform.visible.stale {
        opacity: 0.4;
        filter: grayscale(1);
      }
      .icon-slot {
        display: flex;
        align-items: center;
        height: 22px;
      }
      .icon {
        height: 22px;
        width: auto;
        max-width: 72px;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6));
      }
      .total {
        font-weight: 700;
        font-size: 26px;
        gap: 10px;
      }
      .total-label {
        font-size: 14px;
        text-transform: uppercase;
        opacity: 0.8;
      }
      .layout-horizontal .pill {
        flex-direction: row;
        align-items: center;
        gap: 14px;
      }
      .hide-counts .platform .count {
        display: none;
      }
      .hide-labels .total-label {
        display: none;
      }
      .layout-horizontal.hide-counts .total {
        order: -1;
      }
      .hide-counts .icon {
        max-width: 56px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
